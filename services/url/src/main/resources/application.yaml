server:
  port: ${SERVER_PORT}

spring:
  application:
    name: url-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}


application:
  base-url: ${BASE_URL}
  url:
    default-expiration-days: ${DEFAULT_EXPIRATION_DAYS}
    shortcode-length: ${SHORT_CODE_LENGTH}

logging:
  level:
    org.springframework.security: ${LOG_LEVEL}
    org.hibernate.SQL: DEBUG

keycloak:
  realm: ${KEYCLOAK_REALM}
  auth-server-url: ${KEYCLOAK_URL}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  username: ${KEYCLOAK_ADMIN_USER}
  password: ${KEYCLOAK_ADMIN_USER_PASSWORD}
  token-endpoint: "${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/token"


